name: CI
on:
  push: { branches: [main] }
  pull_request:

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm, cache-dependency-path: frontend-reactjs/package-lock.json }
      - run: npm ci
        working-directory: frontend
      - name: Unit, recognition and accessibility (contrast) tests
        run: npm test
        working-directory: frontend
      - run: npm run build
        working-directory: frontend

  backend:
    runs-on: ubuntu-latest
    env:
      JWT_SECRET: ci-access-secret-ci-access-secret-ci
      JWT_REFRESH_SECRET: ci-refresh-secret-ci-refresh-secret
      SESSION_SECRET: ci-session-secret-ci-session-secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm, cache-dependency-path: backend/package-lock.json }
      - run: npm ci
        working-directory: backend
      - name: Validate the Prisma schema
        run: npx prisma validate
        working-directory: backend
        env: { DATABASE_URL: "postgresql://u:p@localhost:5432/db", DIRECT_URL: "postgresql://u:p@localhost:5432/db" }
      - name: Backend tests (databases and email are mocked)
        run: npx jest --coverage
        working-directory: backend

  docker:
    runs-on: ubuntu-latest
    needs: [frontend, backend]
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t echosign .
