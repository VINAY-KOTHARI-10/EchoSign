# EchoSign on Render: ONE web service (Docker). The image builds the React app and the Express backend serves it, so the
# site, the API and the Socket.IO live-caption connection share one address (no CORS, first-party login cookie).
# Create it with: Render dashboard -> New -> Blueprint -> pick this repo. Details: DEPLOYMENT.md
services:
  - type: web
    name: echosign
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free            # use "starter" for real classes: the free plan sleeps when idle and drops live connections
    healthCheckPath: /health/live   # liveness only; /health/ready also checks both databases (use it for uptime monitors)
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      # The container runs `prisma migrate deploy` before it starts the server (npm run start:migrate).
      # ── secrets: paste these in the Render dashboard (never commit them) ──
      - key: MONGODB_URI
        sync: false
      - key: DATABASE_URL        # Neon pooled connection string, ending ?sslmode=require
        sync: false
      - key: DIRECT_URL          # Neon direct (non-pooled) connection string, used for migrations
        sync: false
      - key: GROQ_API_KEY        # optional: AI notes, lecture questions, translation (basic fallbacks without it)
        sync: false
      - key: GOOGLE_CLIENT_ID    # optional: Google sign-in
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_CALLBACK_URL # https://<your-service>.onrender.com/api/v1/auth/google/callback
        sync: false
      - key: FRONTEND_URL        # https://<your-service>.onrender.com   (the same address, no trailing slash)
        sync: false
      - key: FRONTEND_URLS       # optional: more websites using this backend, comma-separated (see DEPLOYMENT.md, "Two websites, one backend")
        sync: false
      - key: BREVO_API_KEY       # emails the login code; without it nobody can verify an account
        sync: false
      - key: EMAIL_FROM          # a sender verified in Brevo
        sync: false
      # ── generated for you ──
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: SESSION_SECRET
        generateValue: true
